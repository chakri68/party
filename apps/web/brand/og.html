<!doctype html>
<!-- The 1200×630 link-preview image. Rendered by screenshotting this page in a
     browser (it needs Space Grotesk from Google Fonts, which rsvg can't load). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=block">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0e0e0c; color: #f3f1ea;
    font-family: "Space Grotesk", sans-serif;
    display: flex; align-items: center; gap: 72px; padding: 0 96px; box-sizing: border-box;
  }
  .mark { width: 300px; height: 300px; flex: 0 0 auto; }
  h1 { margin: 0; font-size: 150px; font-weight: 700; letter-spacing: -0.05em; line-height: 0.88; }
  h1 span { color: #c6f432; }
  p { margin: 28px 0 0; font-size: 34px; color: #9c9888; }
  .url { margin-top: 40px; font-size: 26px; font-weight: 500; color: #c6f432; }
</style>
</head>
<body>
  <img class="mark" src="mark.svg" alt="">
  <div>
    <h1>party<br>games<span>.</span></h1>
    <p>Sevens with friends, on any phone.</p>
    <div class="url">party-games.chakri.me</div>
  </div>
</body>
</html>
