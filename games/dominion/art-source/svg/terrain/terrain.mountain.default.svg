<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 104" width="96" height="104">
  <g id="ground">
    <!-- EXCEPTION to STYLE.md tile geometry: a real peak does not fit in 16 units of headroom,
       so this tile uses viewBox 0 0 96 104 and every tile vertex is shifted down by 32.
       Diamond (48,48) (96,72) (48,96) (0,72); slab bottom y=104; ground anchor (48,72) -> (0.5, 0.6923).
       Composite with a -32 y offset relative to standard tiles. -->
    <!-- earth slab -->
    <polygon points="0,72 48,96 48,104 0,80" fill="#8A5A33"/>
    <polygon points="48,96 96,72 96,80 48,104" fill="#5E3B20"/>
    <!-- grass top: full mid diamond underlay, then light up-left and dark right facets -->
    <polygon points="48,48 96,72 48,96 0,72" fill="#6BAA3E"/>
    <polygon points="0,72 48,48 64,56 62,70 26,75" fill="#8BC34A"/>
    <polygon points="64,56 96,72 84,78 62,70" fill="#4E8A34"/>
  </g>
  <g id="props">
    <!-- main peak: apex (50,4), ridge down the front through (46,48);
       first polygon is a mid-stone silhouette so AA seams between facets read as stone, not grass -->
    <polygon points="50,4 26,52 10,74 28,86 50,88 86,74 70,44" fill="#A8A49B"/>
    <polygon points="50,4 26,52 46,48" fill="#C9C6BF"/>
    <polygon points="26,52 10,74 28,86 46,48" fill="#A8A49B"/>
    <polygon points="46,48 28,86 50,88" fill="#C9C6BF"/>
    <polygon points="50,4 46,48 50,88 62,64" fill="#A8A49B"/>
    <polygon points="50,4 62,64 86,74 70,44" fill="#7E7A72"/>
    <polygon points="62,64 50,88 86,74" fill="#7E7A72"/>
    <!-- snow cap, one piece per face it sits on -->
    <polygon points="50,4 38,28 42,30 44,27 48,26" fill="#FFFFFF"/>
    <polygon points="50,4 48,26 52,30 56,34" fill="#EEF2F5"/>
    <polygon points="50,4 56,34 59,28 65,34" fill="#CFD8DE"/>
    <!-- foothill, front right -->
    <polygon points="72,62 58,80 68,84" fill="#C9C6BF"/>
    <polygon points="72,62 68,84 82,77" fill="#A8A49B"/>
    <polygon points="72,62 82,77 78,67" fill="#7E7A72"/>
  </g>
</svg>
