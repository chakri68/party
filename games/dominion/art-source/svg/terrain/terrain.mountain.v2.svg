<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 104" width="96" height="104">
  <g id="ground">
    <!-- tall-tile row (STYLE.md): diamond (48,48) (96,72) (48,96) (0,72); slab bottom y=104.
       Two bare peaks, no snow; massif starts at x=16 (default: 10) so the left of the tile stays grass. -->
    <!-- earth slab -->
    <polygon points="0,72 48,96 48,104 0,80" fill="#8A5A33"/>
    <polygon points="48,96 96,72 96,80 48,104" fill="#5E3B20"/>
    <!-- grass top: full mid diamond underlay, then light up-left and dark right facets -->
    <polygon points="48,48 96,72 48,96 0,72" fill="#6BAA3E"/>
    <polygon points="0,72 48,48 64,56 62,70 26,75" fill="#8BC34A"/>
    <polygon points="64,56 96,72 84,78 62,70" fill="#4E8A34"/>
  </g>
  <g id="props">
    <!-- tall peak, back right: apex (60,8), front ridge through (56,52) -->
    <polygon points="60,8 36,64 54,86 88,74 80,50" fill="#A8A49B"/>
    <polygon points="60,8 36,64 56,52" fill="#C9C6BF"/>
    <polygon points="36,64 54,86 56,52" fill="#A8A49B"/>
    <polygon points="60,8 56,52 54,86 70,64" fill="#A8A49B"/>
    <polygon points="60,8 70,64 88,74 80,50" fill="#7E7A72"/>
    <polygon points="70,64 54,86 88,74" fill="#7E7A72"/>
    <!-- short peak, front left: apex (32,34), front ridge through (35,66) -->
    <polygon points="32,34 16,78 34,88 54,76" fill="#A8A49B"/>
    <polygon points="32,34 16,78 35,66" fill="#C9C6BF"/>
    <polygon points="16,78 34,88 35,66" fill="#A8A49B"/>
    <polygon points="32,34 35,66 34,88 54,76" fill="#7E7A72"/>
    <!-- grass creeping up the base: low wedges, lit face then shaded face -->
    <polygon points="26,74 16,80 30,86" fill="#8BC34A"/>
    <polygon points="26,74 30,86 40,83" fill="#4E8A34"/>
    <polygon points="50,77 40,86 54,90" fill="#8BC34A"/>
    <polygon points="50,77 54,90 66,85" fill="#4E8A34"/>
    <polygon points="80,70 70,79 82,81" fill="#8BC34A"/>
    <polygon points="80,70 82,81 90,77" fill="#6BAA3E"/>
  </g>
</svg>
