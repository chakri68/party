    <polygon points="19,36 29,32 30,34.5" fill="#F2DDA4"/>
    <polygon points="19,36 30,34.5 29,39" fill="#E3C887"/>
    <polygon points="29,32 39,35 30,34.5" fill="#E3C887"/>
    <polygon points="30,34.5 39,35 29,39" fill="#C4A86A"/>
