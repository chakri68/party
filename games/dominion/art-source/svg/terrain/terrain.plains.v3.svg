<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" width="96" height="72">
  <g id="ground">
    <!-- earth slab -->
    <polygon points="0,40 48,64 48,72 0,48" fill="#8A5A33"/>
    <polygon points="48,64 96,40 96,48 48,72" fill="#5E3B20"/>
    <!-- grass top: full mid diamond underlay; split differs from default: the light facet
       breaks further left and the dark facet reaches down toward the front -->
    <polygon points="48,16 96,40 48,64 0,40" fill="#6BAA3E"/>
    <polygon points="0,40 48,16 58,21 52,35 16,43" fill="#8BC34A"/>
    <polygon points="58,21 96,40 74,51 52,35" fill="#4E8A34"/>
  </g>
  <g id="props">
    <!-- grass pyramids, back to front. Each: lit left face, shaded right face.
       Cluster A sits on the light facet, so its lit face steps down to mid. -->
    <polygon points="28,25 23.5,34 28,35" fill="#6BAA3E"/>
    <polygon points="28,25 28,35 32.5,33.5" fill="#4E8A34"/>
    <polygon points="35,27 30,36 35,37.5" fill="#6BAA3E"/>
    <polygon points="35,27 35,37.5 39.5,36" fill="#4E8A34"/>
    <polygon points="23,32 20,37.5 23,38.5" fill="#6BAA3E"/>
    <polygon points="23,32 23,38.5 26,37.5" fill="#4E8A34"/>
    <!-- cluster B on the dark facet: lit face light, shaded face mid -->
    <polygon points="76,35 72,43 76,44" fill="#8BC34A"/>
    <polygon points="76,35 76,44 80,42.5" fill="#6BAA3E"/>
    <polygon points="81.5,38 77.5,45.5 81.5,46.5" fill="#8BC34A"/>
    <polygon points="81.5,38 81.5,46.5 85,45" fill="#6BAA3E"/>
  </g>
</svg>
