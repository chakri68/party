<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" width="96" height="72">
  <g id="ground">
    <!-- wet slab: same faces as the earth slab, so water and land tiles butt cleanly -->
    <polygon points="0,40 48,64 48,72 0,48" fill="#2B8E9A"/>
    <polygon points="48,64 96,40 96,48 48,72" fill="#1E6C78"/>
    <!-- water top: full mid diamond underlay, then light up-left, dark right, and a dark front-right sliver -->
    <polygon points="48,16 96,40 48,64 0,40" fill="#5FD0D8"/>
    <polygon points="0,40 48,16 64,24 62,38 26,43" fill="#8FE3E8"/>
    <polygon points="64,24 96,40 84,46 62,38" fill="#3BB0BC"/>
    <!-- ripple on the mid water -->
    <polygon points="24,51.5 44,45 38.5,50.5" fill="#8FE3E8"/>
  </g>
  <g id="props">
  </g>
</svg>
