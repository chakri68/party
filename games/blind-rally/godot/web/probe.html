<!doctype html>
<!--
  Throwaway M0 bridge probe (repo map §5 M0 step 5). Not part of the app.
  export-godot.mjs copies this next to the export as probe.html; serve that
  dir and open /probe.html. It iframes ./index.html full-screen, plays host,
  and drives the car through receiveControl at 30 Hz.

  The controls float over the game, small and translucent, so a landscape
  phone still gets the whole screen for the view (in the real game the
  Navigator has no drive controls at all; the Driver is on another device).
  "auto" hands the car to Godot's debug autopilot ({kind:'autopilot'} race
  event) instead of sending anything from here.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blind Rally bridge probe</title>
<style>
  :root { color-scheme: dark; font: 13px/1.3 system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #e6ebe4; }
  #stage { position: fixed; inset: 0; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; z-index: 2; display: flex; gap: 6px; }
  button {
    font: inherit; padding: 5px 9px; color: inherit; cursor: pointer;
    background: rgb(20 24 21 / 0.55); border: 1px solid rgb(255 255 255 / 0.18); border-radius: 7px;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  button[aria-pressed="true"] { background: rgb(150 100 20 / 0.7); border-color: #d9a030; }
  /* Pads sit in the bottom corners, thumb-sized but see-through. */
  .pad { width: 52px; height: 44px; padding: 0; font-size: 18px; touch-action: none; user-select: none; -webkit-user-select: none; }
  #left { left: max(10px, env(safe-area-inset-left)); bottom: 10px; }
  #right { right: max(10px, env(safe-area-inset-right)); bottom: 10px; }
  /* The rest folds into one button at the bottom centre. */
  #menu { left: 50%; bottom: 10px; transform: translateX(-50%); flex-direction: column; align-items: center; }
  #more { display: none; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: min(92vw, 520px); }
  #menu.open #more { display: flex; }
  #stats {
    display: none; font: 11px/1.35 ui-monospace, monospace; white-space: pre; max-height: 30vh; overflow: auto;
    background: rgb(0 0 0 / 0.55); padding: 6px 8px; border-radius: 7px; max-width: 92vw;
  }
  #menu.open #stats { display: block; }
  #auto { font-weight: 600; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="ui" id="left">
  <button class="pad" data-k="left" aria-label="steer left">◀</button>
  <button class="pad" data-k="right" aria-label="steer right">▶</button>
</div>
<div class="ui" id="right">
  <button class="pad" data-k="brake" aria-label="brake">■</button>
  <button class="pad" data-k="gas" aria-label="throttle">▲</button>
</div>
<div class="ui" id="menu">
  <div id="stats">booting…</div>
  <div id="more">
    <button id="silence">go silent</button>
    <button id="gps" aria-pressed="false">gps marker</button>
    <button id="clouds">clouds 0.4</button>
    <button id="reset">reset car</button>
    <button id="remount">remount ×5</button>
  </div>
  <div style="display:flex;gap:6px">
    <button id="auto" aria-pressed="true">auto</button>
    <button id="toggle" aria-expanded="false">⋯</button>
  </div>
</div>
<script>
const SEND_HZ = 30;
const CLOUD_STEPS = [0, 0.4, 0.8, 1];
const stage = document.getElementById('stage');
const statsEl = document.getElementById('stats');
const state = window.probeState = {
  mounts: 0, ready: false, snapshots: 0, snapHz: 0, last: null, events: [],
  sent: 0, auto: true, silent: false, keys: new Set(), firstPos: null,
  // One sky per page load, like one sky per race: every remount reuses it.
  seed: Math.floor(Math.random() * 2 ** 31), clouds: 0.4,
};
let iframe = null, host = null;

function makeHost() {
  // What the real Navigator host will hand to Godot (map §3.4).
  return {
    emitSnapshot(s) {
      state.snapshots++; state.last = s;
      if (!state.firstPos) state.firstPos = s.position;
    },
    emitPhysicsEvent(e) { state.events.push(e); if (state.events.length > 20) state.events.shift(); },
    ready() {
      state.ready = true;
      host.initSession({
        assists: { liveMarker: gpsBtn.getAttribute('aria-pressed') === 'true' }, keyboard: false,
        seed: state.seed, clouds: state.clouds, autopilot: state.auto,
      }, 'probe-seat');
    },
  };
}

function attach() {
  // Set it now and again on load: the iframe's about:blank window can be
  // replaced when the real document arrives. Godot polls for it anyway.
  if (iframe && iframe.contentWindow && !iframe.contentWindow.blindRallyHost) iframe.contentWindow.blindRallyHost = host;
}

function mount() {
  unmount();
  state.mounts++; state.ready = false; state.firstPos = null; state.snapshots = 0;
  host = makeHost();
  iframe = document.createElement('iframe');
  iframe.src = './index.html';
  iframe.allow = 'fullscreen';
  stage.appendChild(iframe);
  attach();
  iframe.addEventListener('load', attach);
}

function unmount() {
  if (iframe) { iframe.remove(); iframe = null; host = null; }
}

function event(e) { host?.receiveAuthoritativeRaceEvent?.(e); }

function setAuto(on) {
  if (state.auto === on) return;
  state.auto = on;
  autoBtn.setAttribute('aria-pressed', on);
  event({ kind: 'autopilot', on });
}

function control() {
  const k = state.keys;
  return {
    steer: (k.has('right') ? 1 : 0) - (k.has('left') ? 1 : 0),
    throttle: k.has('gas') ? 1 : 0,
    brake: k.has('brake') ? 1 : 0,
  };
}

let seq = 0;
setInterval(() => {
  // While auto is on Godot drives itself (and ignores remote control).
  if (!host || !host.receiveControl || state.silent || state.auto) return;
  host.receiveControl({ seq: ++seq, ...control() });
  state.sent++;
}, 1000 / SEND_HZ);

// Snapshot rate, measured over 1 s windows.
let lastCount = 0;
setInterval(() => {
  state.snapHz = state.snapshots - lastCount; lastCount = state.snapshots;
  const s = state.last;
  statsEl.textContent =
    `mounts ${state.mounts}  ready ${state.ready}  sent ${state.sent}  snaps ${state.snapshots} (${state.snapHz}/s)\n` +
    `sky seed ${state.seed}  clouds ${state.clouds}  ${state.auto ? 'autopilot' : 'manual'}\n` +
    (s ? `pos ${s.position.map(n => n.toFixed(1)).join(', ')}  speed ${s.speed}  trip ${s.distance}  cp ${s.checkpointHint}  ${s.surface}\n` : '') +
    (performance.memory ? `js heap ${(performance.memory.usedJSHeapSize / 1048576).toFixed(0)} MiB\n` : '') +
    state.events.slice(-4).map(e => JSON.stringify(e)).join('\n');
}, 1000);

// Controls. Touching a pad takes the car back from the autopilot.
const autoBtn = document.getElementById('auto');
autoBtn.onclick = () => setAuto(!state.auto);
for (const b of document.querySelectorAll('.pad')) {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); state.keys.add(k); setAuto(false); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, () => state.keys.delete(k));
}
const KEYMAP = { KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', KeyW: 'gas', ArrowUp: 'gas', KeyS: 'brake', ArrowDown: 'brake' };
addEventListener('keydown', e => { const k = KEYMAP[e.code]; if (k) { state.keys.add(k); setAuto(false); } });
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) state.keys.delete(k); });
addEventListener('blur', () => state.keys.clear());
const menu = document.getElementById('menu');
const toggle = document.getElementById('toggle');
toggle.onclick = () => { const open = menu.classList.toggle('open'); toggle.setAttribute('aria-expanded', open); };
const silenceBtn = document.getElementById('silence');
silenceBtn.onclick = () => { state.silent = !state.silent; silenceBtn.setAttribute('aria-pressed', state.silent); };
const gpsBtn = document.getElementById('gps');
gpsBtn.onclick = () => {
  const on = gpsBtn.getAttribute('aria-pressed') !== 'true';
  gpsBtn.setAttribute('aria-pressed', on);
  event({ kind: 'assists', liveMarker: on });
};
const cloudsBtn = document.getElementById('clouds');
cloudsBtn.onclick = () => {
  state.clouds = CLOUD_STEPS[(CLOUD_STEPS.indexOf(state.clouds) + 1) % CLOUD_STEPS.length];
  cloudsBtn.textContent = `clouds ${state.clouds}`;
  event({ kind: 'weather', seed: state.seed, clouds: state.clouds });
};
document.getElementById('reset').onclick = () => event({ kind: 'reset' });
document.getElementById('remount').onclick = async () => {
  // iOS memory check: watch Safari's memory gauge across these.
  for (let i = 0; i < 5; i++) {
    mount();
    await new Promise(r => { const t = setInterval(() => { if (state.ready) { clearInterval(t); r(); } }, 200); });
    await new Promise(r => setTimeout(r, 1500));
  }
};

mount();
</script>
</body>
</html>
